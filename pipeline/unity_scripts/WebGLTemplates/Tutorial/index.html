<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111418; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #111418; outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, 70vw);
                 font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #cfd6e0; text-align: center; }
      #bar { height: 6px; margin-top: 10px; background: #2a313b; border-radius: 3px; overflow: hidden; }
      #bar-full { height: 100%; width: 0; background: #4f8fe8; transition: width 0.2s; }
      #banner { position: absolute; left: 0; right: 0; top: 0; font: 14px system-ui, sans-serif; text-align: center; }
      #banner div { padding: 8px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading {{{ PRODUCT_NAME }}}…<div id="bar"><div id="bar-full"></div></div></div>
    <div id="banner"></div>
    <script>
      // Full-window page for the interactive twin (the default template's 960 x 600 box makes the UI too small).
      function showBanner(msg, type) {
        var banner = document.querySelector("#banner"), div = document.createElement("div");
        div.textContent = msg;
        div.style.background = type == "error" ? "#c0392b" : "#f1c40f";
        div.style.color = type == "error" ? "#fff" : "#111";
        banner.appendChild(div);
        if (type != "error") setTimeout(function () { banner.removeChild(div); }, 5000);
      }
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(document.querySelector("#unity-canvas"), config, function (progress) {
          document.querySelector("#bar-full").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance;     // lets a page script (or a test) talk to the tutorial
          document.querySelector("#loading").style.display = "none";
        }).catch(function (message) { showBanner(message, "error"); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
